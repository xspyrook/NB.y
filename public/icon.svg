<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b2d30"/>
      <stop offset="100%" stop-color="#18191b"/>
    </linearGradient>
    <linearGradient id="androidGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3ddc84"/>
      <stop offset="100%" stop-color="#25b367"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background rounded squircle with border -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect x="4" y="4" width="504" height="504" rx="124" fill="none" stroke="#393b40" stroke-width="8"/>

  <!-- Glowing subtle ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#3ddc84" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Android Robot Head Silhouette -->
  <g filter="url(#shadow)" transform="translate(0, -10)">
    <!-- Antennas -->
    <line x1="200" y1="180" x2="165" y2="135" stroke="url(#androidGreen)" stroke-width="18" stroke-linecap="round"/>
    <line x1="312" y1="180" x2="347" y2="135" stroke="url(#androidGreen)" stroke-width="18" stroke-linecap="round"/>

    <!-- Head Dome -->
    <path d="M 140 250 A 116 116 0 0 1 372 250 Z" fill="url(#androidGreen)"/>

    <!-- Robot Eyes -->
    <circle cx="195" cy="210" r="12" fill="#1e1f22"/>
    <circle cx="317" cy="210" r="12" fill="#1e1f22"/>
  </g>

  <!-- Code brackets `< />` for Mobile IDE symbol -->
  <g transform="translate(0, 50)">
    <!-- Left bracket < -->
    <path d="M 190 310 L 130 355 L 190 400" fill="none" stroke="#3ddc84" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Slash / -->
    <line x1="275" y1="310" x2="235" y2="400" stroke="#dfe1e5" stroke-width="18" stroke-linecap="round"/>

    <!-- Right bracket > -->
    <path d="M 320 310 L 380 355 L 320 400" fill="none" stroke="#3ddc84" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Subtle Kotlin K badge -->
  <circle cx="410" cy="110" r="42" fill="#7f52ff" stroke="#1e1f22" stroke-width="6"/>
  <path d="M 395 85 L 395 135 M 395 110 L 425 85 M 405 102 L 427 135" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
