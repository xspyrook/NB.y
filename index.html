    <script>
      // Gracefully handle Vite dev-server WebSocket messages in iframe/container
      (function() {
        const origError = console.error;
        console.error = function(...args) {
          if (args.length > 0) {
            const firstArg = String(args[0]);
            if (firstArg.includes('WebSocket closed without opened') || (firstArg.includes('[vite]') && firstArg.includes('WebSocket'))) {
              return;
            }
          }
          origError.apply(console, args);
        };
      })();

      window.addEventListener('error', function(event) {
        if (event.message && (event.message.includes('WebSocket') || event.message.includes('ws://') || event.message.includes('wss://'))) {
          event.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && String(event.reason).includes('WebSocket')) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      });
    </script>

  <body>

    <script type="module" src="/src/main.tsx"></script>
